openapi: 3.0.3
info:
  title: MyTrip API
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /auth/register:
    post:
      summary: Регистрация пользователя
      responses:
        '201':
          description: Пользователь зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /auth/login:
    post:
      summary: Вход пользователя
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /auth/refresh:
    post:
      summary: Обновление токена
      responses:
        '200':
          description: Токен обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /auth/logout:
    post:
      summary: Выход пользователя
      responses:
        '204':
          description: Успешный выход
  /users/me:
    get:
      summary: Получить информацию о текущем пользователе
      responses:
        '200':
          description: Информация о пользователе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /trips:
    get:
      summary: Получить список поездок
      responses:
        '200':
          description: Список поездок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
    post:
      summary: Создать новую поездку
      responses:
        '201':
          description: Поездка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
  /trips/{id}:
    get:
      summary: Получить поездку по ID
      responses:
        '200':
          description: Поездка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
    put:
      summary: Обновить поездку
      responses:
        '200':
          description: Поездка обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
    delete:
      summary: Удалить поездку
      responses:
        '204':
          description: Поездка удалена
  /trips/{id}/stops:
    get:
      summary: Получить список остановок поездки
      responses:
        '200':
          description: Список остановок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Stop'
    post:
      summary: Создать новую остановку
      responses:
        '201':
          description: Остановка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stop'
  /stops/{stopId}:
    put:
      summary: Обновить остановку
      responses:
        '200':
          description: Остановка обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stop'
    delete:
      summary: Удалить остановку
      responses:
        '204':
          description: Остановка удалена
  /trips/{id}/photos:
    post:
      summary: Загрузить фото к поездке
      responses:
        '201':
          description: Фото загружено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
  /photos/{id}/url:
    get:
      summary: Получить URL фото
      responses:
        '200':
          description: URL фото
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoUrl'
  /photos/{id}:
    delete:
      summary: Удалить фото
      responses:
        '204':
          description: Фото удалено
  /trips/{id}/export:
    get:
      summary: Экспорт поездки
      responses:
        '200':
          description: Экспорт поездки
          content:
            application/octet-stream: {}
  /healthz:
    get:
      summary: Проверка состояния сервера
      responses:
        '200':
          description: Сервер работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
      required:
        - id
        - email
        - name
    Trip:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
      required:
        - id
        - name
    Stop:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        location:
          $ref: '#/components/schemas/Location'
        arrival_date:
          type: string
          format: date-time
        departure_date:
          type: string
          format: date-time
      required:
        - id
        - name
    Photo:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        trip_id:
          type: string
      required:
        - id
        - url
    PhotoUrl:
      type: object
      properties:
        url:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
        - url
        - expires_at
    Location:
      type: object
      properties:
        latitude:
          type: number
        longitude:
          type: number
      required:
        - latitude
        - longitude
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
      required:
        - error
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
        - access_token
        - user
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
      required:
        - access_token
    Health:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT token
  
security:
  - bearerAuth: []
