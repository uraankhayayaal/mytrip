openapi: 3.0.3
info:
  title: MyTrip API
  version: 1.0.0
  description: API для приложения MyTrip
servers:
  - url: http://localhost:8080/api/v1
paths:
  /auth/register:
    post:
      summary: Регистрация нового пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Пользователь с таким email уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      summary: Вход пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          description: Неверные учетные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/refresh:
    post:
      summary: Обновление access токена
      responses:
        '200':
          description: Новый access токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Неверный refresh токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      summary: Выход из системы
      responses:
        '204':
          description: Успешный выход
  /users/me:
    get:
      summary: Получить информацию о текущем пользователе
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Информация о пользователе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Неавторизованный доступ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trips:
    get:
      summary: Получить список поездок пользователя
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список поездок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
    post:
      summary: Создать новую поездку
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreateRequest'
      responses:
        '201':
          description: Поездка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trips/{id}:
    get:
      summary: Получить информацию о поездке
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Информация о поездке
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '404':
          description: Поездка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Обновить информацию о поездке
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripUpdateRequest'
      responses:
        '200':
          description: Поездка обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Поездка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Удалить поездку
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Поездка удалена
        '404':
          description: Поездка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trips/{id}/stops:
    get:
      summary: Получить список остановок поездки
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Список остановок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Stop'
        '404':
          description: Поездка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Создать новую остановку
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopCreateRequest'
      responses:
        '201':
          description: Остановка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stop'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Поездка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /stops/{stopId}:
    put:
      summary: Обновить информацию об остановке
      security:
        - bearerAuth: []
      parameters:
        - name: stopId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopUpdateRequest'
      responses:
        '200':
          description: Остановка обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stop'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Остановка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Удалить остановку
      security:
        - bearerAuth: []
      parameters:
        - name: stopId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Остановка удалена
        '404':
          description: Остановка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trips/{id}/photos:
    post:
      summary: Загрузить фото для поездки
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoUploadRequest'
      responses:
        '201':
          description: Фото загружено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoResponse'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Поездка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /photos/{id}/url:
    get:
      summary: Получить URL для загрузки фото
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: URL для загрузки фото
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoURLResponse'
        '404':
          description: Фото не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /photos/{id}:
    delete:
      summary: Удалить фото
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Фото удалено
        '404':
          description: Фото не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trips/{id}/export:
    get:
      summary: Экспорт поездки в файл
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [pdf, csv]
      responses:
        '200':
          description: Файл экспорта
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          description: Некорректный формат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Поездка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /healthz:
    get:
      summary: Проверка состояния сервиса
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - created_at
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        name:
          type: string
      required:
        - email
        - password
        - name
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
    Trip:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - title
        - start_date
        - end_date
        - created_at
        - updated_at
    TripCreateRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
      required:
        - title
        - start_date
        - end_date
    TripUpdateRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
    Stop:
      type: object
      properties:
        id:
          type: string
        trip_id:
          type: string
        name:
          type: string
        description:
          type: string
        location:
          $ref: '#/components/schemas/Location'
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - trip_id
        - name
        - created_at
        - updated_at
    Location:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
      required:
        - lat
        - lng
    StopCreateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        location:
          $ref: '#/components/schemas/Location'
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
      required:
        - name
        - location
    StopUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        location:
          $ref: '#/components/schemas/Location'
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
    Photo:
      type: object
      properties:
        id:
          type: string
        trip_id:
          type: string
        url:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - trip_id
        - url
        - created_at
    PhotoUploadRequest:
      type: object
      properties:
        file_name:
          type: string
        content_type:
          type: string
      required:
        - file_name
        - content_type
    PhotoResponse:
      type: object
      properties:
        photo_url:
          type: string
    PhotoURLResponse:
      type: object
      properties:
        url:
          type: string
        expires_at:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
          required:
            - code
            - message
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
      required:
        - status
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT