name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pr-checks:
    name: PR checks (lint + test + build)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # golangci-lint нужен для 'make lint' (backend-lint)
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: go
          args: --timeout=3m

      - name: deps
        run: make deps

      # BLOCKING: golangci-lint + eslint падают CI при ошибках
      - name: lint
        run: make lint

      - name: test
        run: make test

      - name: build
        run: make build

  e2e:
    name: E2E (main)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [pr-checks]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: deps
        run: make deps

      # самозавершающийся: up → wait → e2e-сценарии → down → exit code
      - name: e2e
        run: make e2e

      - name: upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
